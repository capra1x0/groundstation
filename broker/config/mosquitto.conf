# --- Persistence ---
# Retained messages and persistent sessions are written to disk
# and restored after the broker is stopped and started again.
persistence true
persistence_location /mosquitto/data/

# --- Logging ---
# Log to stdout so "docker compose logs -f" shows everything
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %d-%m-%y %H:%M:%S

# --- Listeners ---
# Plain MQTT for devices and Go programs
listener 1883
protocol mqtt

# MQTT over WebSockets for browser-based clients
listener 9001
protocol websockets

# --- Auth ---
# Anonymous access is fine for a local playground on your home network.
# Switch to a password file before exposing this anywhere else.
allow_anonymous true
